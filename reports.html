<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zi 수집함 · 이벤트</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
         max-width: 1080px; margin: 0 auto; padding: 24px 18px 80px; color: #1a1a1a; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 18px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  input[type=password] { font: inherit; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; }
  button { font: inherit; padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; }
  button.primary { background: #111; color: #fff; border-color: #111; }
  button:hover { border-color: #999; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .chip { padding: 5px 11px; border-radius: 999px; border: 1px solid #e0e0e0; font-size: 13px; cursor: pointer; color: #555; }
  .chip.on { background: #111; color: #fff; border-color: #111; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 20px; }
  .card { border: 1px solid #eee; border-radius: 12px; padding: 12px 14px; }
  .card .n { font-size: 22px; font-weight: 600; }
  .card .l { font-size: 12px; color: #888; margin-top: 2px; }
  .grp { border: 1px solid #f0f0f0; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .grp h3 { font-size: 13px; color: #666; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px solid #f7f7f7; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  th { color: #999; font-weight: 500; font-size: 12px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 12px; background: #f2f2f2; }
  .a-report { background: #ffe8e8; color: #b00; }
  .a-star { background: #fff4d6; color: #9a6b00; }
  .a-open { background: #e6f0ff; color: #1155cc; }
  .a-ignore, .a-ignore_daily { background: #eee; color: #888; }
  .a-suggest_open, .a-suggest_dismiss { background: #eef7ee; color: #2a7a2a; }
  .muted { color: #aaa; }
  .tblwrap { overflow-x: auto; }
  .mini { font-size: 12px; padding: 4px 9px; }
  .err { color: #b00; font-size: 13px; }
  .more { margin: 14px 0; text-align: center; }
  .note { color: #aaa; font-size: 12px; margin: -6px 0 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>zi 수집함</h1>
  <p class="sub">사용자 선택(별·열기·신고·추천·무반응) 이벤트 — 라벨만. 원문 없음. 무반응은 하루 1회 (앱, 판정)별 개수로 들어옴.</p>

  <div class="bar">
    <input id="pw" type="password" placeholder="관리자 비밀번호" />
    <button class="primary" id="load">불러오기</button>
    <button id="csv">CSV 내보내기(기간 전체)</button>
    <button id="backfill" class="mini" hidden>집계 다시 계산</button>
    <label style="font-size:13px;color:#666;margin-left:6px;">
      <input type="checkbox" id="hideFixed" /> 처리됨 숨기기
    </label>
    <span id="msg" class="err"></span>
  </div>

  <div class="chips" id="period"></div>
  <div id="summary"></div>
  <p class="note">카드·판정별·앱별 = 기간 집계(stats, KST 날짜). 아래 목록·반응 필터 = 불러온 행 기준.</p>
  <div class="chips" id="chips"></div>
  <div class="tblwrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div class="more"><button id="more" hidden>더 보기</button></div>

<script>
(function () {
  var ACTIONS = ['report','star','open','ignore','suggest_open','suggest_dismiss'];
  var LABELS = { report:'신고🪄', star:'별⭐', open:'열기', ignore:'무반응', ignore_daily:'무반응(일)', suggest_open:'추천 열기', suggest_dismiss:'추천 안 볼래' };
  var PERIODS = [['today','오늘'],['7d','7일'],['30d','30일'],['all','전체']];
  var all = [], filter = 'all', pw = '', period = '7d', cursor = null, st = null;

  function post(body) {
    return fetch('/api/reports', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(function (r) {
        // JSON이 아닌 서버 응답(타임아웃 페이지 등)도 그대로 보이게 — 본문 텍스트를 error로.
        return r.text().then(function (t) {
          var j; try { j = JSON.parse(t); } catch (e) { j = { error: (t || '').slice(0, 300) || ('HTTP ' + r.status) }; }
          return { ok:r.ok, status:r.status, j:j };
        });
      });
  }
  function msg(t, err) { var m=document.getElementById('msg'); m.textContent=t||''; m.className = err?'err':''; m.style.color = err?'#b00':'#2a2'; }
  function esc(v) { return String(v==null?'':v).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // KST 기준 yyyy-MM-dd — 서버 stats 문서 키와 동일.
  function kstDay(ms) { return new Date(ms + 9*3600*1000).toISOString().slice(0,10); }
  function range() {
    if (period === 'all') return {};
    var now = Date.now(), back = period === 'today' ? 0 : (period === '7d' ? 6 : 29);
    return { from: kstDay(now - back*86400000), to: kstDay(now) };
  }
  function withRange(o) { var r = range(); if (r.from) { o.from = r.from; o.to = r.to; } return o; }

  // 이벤트 1행의 무게 — ignore_daily는 count건.
  function w(x) { return x.action === 'ignore_daily' ? (Number(x.count) || 0) : 1; }

  function shown() {
    var hide = document.getElementById('hideFixed').checked;
    return all.filter(function (x) {
      if (filter === 'ignore') { if (x.action !== 'ignore' && x.action !== 'ignore_daily') return false; }
      else if (filter !== 'all' && x.action !== filter) return false;
      if (hide && x.status === 'fixed') return false;
      return true;
    });
  }

  function fmtTs(ms) { if(!ms) return ''; var d=new Date(ms); return d.getMonth()+1+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function sorted(m) { return Object.keys(m||{}).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];}); }

  function renderPeriod() {
    var el = document.getElementById('period');
    el.innerHTML = PERIODS.map(function(p){ return '<span class="chip'+(period===p[0]?' on':'')+'" data-p="'+p[0]+'">'+p[1]+'</span>'; }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(c){ c.onclick=function(){ period=c.getAttribute('data-p'); renderPeriod(); if (pw) load(); }; });
  }

  function renderSummary() {
    var s = document.getElementById('summary');
    if (!st) { s.innerHTML = ''; return; }
    var a = st.action || {};
    var n = function(k){ return a[k] || 0; };
    var cards = [
      [n('report'),'신고🪄'], [n('star'),'별⭐'], [n('open'),'열기'],
      [n('ignore') + n('ignore_daily'),'무반응'], [n('suggest_open') + n('suggest_dismiss'),'추천 반응'], [st.total || 0,'전체'],
    ];
    function grp(title, arr){ return '<div class="grp"><h3>'+title+'</h3>'+(arr.slice(0,12).map(function(r){return '<div class="row"><span>'+esc(r[0])+'</span><span>'+r[1]+'</span></div>';}).join('')||'<div class="muted">없음</div>')+'</div>'; }
    s.innerHTML = '<div class="cards">' + cards.map(function(c){ return '<div class="card"><div class="n">'+c[0]+'</div><div class="l">'+c[1]+'</div></div>'; }).join('') + '</div>'
      + '<div class="two">'+grp('zi판정별 (기간)',sorted(st.verdict))+grp('앱별 (기간)',sorted(st.app))+'</div>';
  }

  function render() {
    renderSummary();
    var list = shown();
    var chips = document.getElementById('chips');
    var opts = [['all','전체']].concat(ACTIONS.map(function(a){return [a,LABELS[a]];}));
    chips.innerHTML = opts.map(function(o){ return '<span class="chip'+(filter===o[0]?' on':'')+'" data-f="'+o[0]+'">'+o[1]+'</span>'; }).join('');
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function(c){ c.onclick=function(){ filter=c.getAttribute('data-f'); render(); }; });

    var thead = document.querySelector('#tbl thead');
    thead.innerHTML = '<tr><th>시각</th><th>반응</th><th>건수</th><th>zi판정</th><th>앱</th><th>신호</th><th>상태</th><th></th></tr>';
    var tb = document.querySelector('#tbl tbody');
    tb.innerHTML = list.map(function(x){
      return '<tr>'
        + '<td class="muted">'+(x.action==='ignore_daily' && x.day ? esc(x.day) : fmtTs(x.createdAt))+'</td>'
        + '<td><span class="tag a-'+esc(x.action)+'">'+esc(LABELS[x.action]||x.action)+'</span></td>'
        + '<td>'+w(x)+'</td>'
        + '<td>'+esc(x.ziVerdict)+'</td>'
        + '<td>'+esc(x.app)+'</td>'
        + '<td class="muted">'+esc(x.signals)+'</td>'
        + '<td>'+(x.status==='fixed'?'<span class="muted">처리됨</span>':'new')+'</td>'
        + '<td style="white-space:nowrap;">'
          + '<button class="mini" data-fix="'+esc(x.id)+'">처리</button> '
          + '<button class="mini" data-del="'+esc(x.id)+'">삭제</button>'
        + '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="muted">데이터 없음</td></tr>';
    document.getElementById('more').hidden = !cursor;

    Array.prototype.forEach.call(tb.querySelectorAll('[data-fix]'), function(b){ b.onclick=function(){ act('fix', b.getAttribute('data-fix')); }; });
    Array.prototype.forEach.call(tb.querySelectorAll('[data-del]'), function(b){ b.onclick=function(){ act('delete', b.getAttribute('data-del')); }; });
  }

  function page(cur, limit) {
    return post(withRange({ password: pw, action: 'list', cursor: cur || undefined, limit: limit }));
  }

  function load() {
    pw = document.getElementById('pw').value;
    if (!pw) { msg('비밀번호를 넣어줘', true); return; }
    msg('불러오는 중...');
    Promise.all([post(withRange({ password: pw, action: 'stats' })), page(null, 100)]).then(function(rs){
      var bad = rs.filter(function(r){ return !r.ok; })[0];
      if (bad) { msg(bad.j.error || '실패', true); return; }
      st = rs[0].j; all = rs[1].j.items || []; cursor = rs[1].j.nextCursor || null;
      document.getElementById('backfill').hidden = false; // 로그인(불러오기 성공) 후에만 노출
      msg('집계 ' + (st.days||0) + '일 · 목록 ' + all.length + '건' + (cursor ? '(더 있음)' : ''));
      render();
    }).catch(function(e){ msg(e.message, true); });
  }

  function more() {
    if (!cursor) return;
    page(cursor, 100).then(function(r){
      if (!r.ok) { msg(r.j.error || '실패', true); return; }
      all = all.concat(r.j.items || []); cursor = r.j.nextCursor || null;
      msg('목록 ' + all.length + '건' + (cursor ? '(더 있음)' : ''));
      render();
    }).catch(function(e){ msg(e.message, true); });
  }

  function act(a, id) {
    post({ password: pw, action: a, id: id }).then(function(r){
      if (!r.ok) { msg(r.j.error || '실패', true); return; }
      if (a === 'delete') all = all.filter(function(x){return x.id!==id;});
      else { var it = all.find(function(x){return x.id===id;}); if(it) it.status='fixed'; }
      render();
    });
  }

  // CSV = 선택 기간 전체 — 페이지(500건씩)를 끝까지 순회.
  function csv() {
    if (!pw) { msg('먼저 불러오기', true); return; }
    var rowsAll = [];
    function step(cur) {
      return page(cur, 500).then(function(r){
        if (!r.ok) throw new Error(r.j.error || '실패');
        rowsAll = rowsAll.concat(r.j.items || []);
        msg('CSV 모으는 중... ' + rowsAll.length + '건');
        return r.j.nextCursor ? step(r.j.nextCursor) : rowsAll;
      });
    }
    step(null).then(function(list){
      var head = ['createdAt','action','count','day','ziVerdict','app','signals','installId','appVersion','status'];
      var rows = [head.join(',')].concat(list.map(function(x){
        return head.map(function(k){
          var v = k==='createdAt' ? fmtTs(x[k]) : (k==='count' ? w(x) : (x[k]==null?'':x[k]));
          return '"'+String(v).replace(/"/g,'""')+'"';
        }).join(',');
      }));
      var blob = new Blob(['﻿'+rows.join('\n')], { type:'text/csv;charset=utf-8;' });
      var a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='zi_events_'+period+'.csv'; a.click();
      msg('CSV ' + list.length + '건');
    }).catch(function(e){ msg(e.message, true); });
  }

  // 집계 다시 계산 — events 전체로 stats 덮어쓰기(서버 backfill, 여러 번 해도 중복 없음). 화면 비밀번호 그대로 사용.
  function backfill() {
    if (!pw) { msg('먼저 불러오기', true); return; }
    if (!confirm('전체 이벤트로 날짜별 집계를 다시 계산할까요? (여러 번 해도 중복 없음)')) return;
    var b = document.getElementById('backfill');
    b.disabled = true; msg('계산 중…');
    post({ password: pw, action: 'backfill' }).then(function(r){
      b.disabled = false;
      if (!r.ok) { msg((r.j && r.j.error) || ('실패 (HTTP ' + r.status + ')'), true); return; }
      msg('완료 — 이벤트 ' + (r.j.scanned || 0) + '건, ' + (r.j.days || 0) + '일 집계');
      setTimeout(load, 800);
    }).catch(function(e){ b.disabled = false; msg(e.message, true); });
  }

  renderPeriod();
  document.getElementById('backfill').onclick = backfill;
  document.getElementById('load').onclick = load;
  document.getElementById('more').onclick = more;
  document.getElementById('csv').onclick = csv;
  document.getElementById('hideFixed').onchange = render;
  document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') load(); });
})();
</script>
</body>
</html>
